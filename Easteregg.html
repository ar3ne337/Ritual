<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emilijus ♡ Rustina</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'EB Garamond', Georgia, serif;
      overflow: hidden;
    }

    .glitch-card {
      position: relative;
      padding: 3rem 2rem;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .glitch-scan-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.035) 3px,
        rgba(0,0,0,0.035) 6px
      );
      animation: scan-flicker 8s infinite linear;
    }

    @keyframes scan-flicker {
      0%,99.5%,100% { opacity:1; }
      99.6%,99.9%   { opacity:0.3; }
    }

    .glitch-ritual-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .glitch-ritual {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(3rem, 12vw, 10rem);
      font-weight: 400;
      font-style: italic;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1;
      position: relative;
      display: inline-block;
      text-align: center;
    }

    .glitch-red {
      color: #ff0000;
      position: relative;
      z-index: 1;
      font-style: italic;
    }

    /* Glitch slices */
    .glitch-ritual::before,
    .glitch-ritual::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      font-style: inherit;
      letter-spacing: inherit;
      opacity: 0;
      pointer-events: none;
      text-shadow: none;
    }

    .glitch-ritual::before {
      color: #ff0000;
      clip-path: inset(12% 0 55% 0);
      animation: g-slice-a 2.5s infinite steps(1);
    }
    .glitch-ritual::after {
      color: #ffffff;
      clip-path: inset(52% 0 18% 0);
      animation: g-slice-b 3.1s infinite steps(1);
    }

    @keyframes g-slice-a {
      0%,92%,100% { opacity:0; transform:translate(0,0); }
      93%          { opacity:0.55; transform:translate(-5px,1px); }
      94%          { opacity:0.7; transform:translate(4px,-2px); }
      95%          { opacity:0; transform:translate(0,0); }
    }
    @keyframes g-slice-b {
      0%,88%,100% { opacity:0; transform:translate(0,0); }
      89%          { opacity:0.45; transform:translate(4px,-1px); }
      90%          { opacity:0.65; transform:translate(-3px,2px); }
      91%          { opacity:0; transform:translate(0,0); }
    }

    /* Intense & mega glitch classes (for extra flair, can be added via JS or left as is) */
    .glitch-ritual.intense::before {
      animation: g-int-a 0.25s steps(2)!important;
      opacity:0.8!important;
      clip-path:inset(5% 0 70% 0)!important;
      transform:translate(-8px,3px)!important;
    }
    .glitch-ritual.intense::after {
      animation: g-int-b 0.25s steps(2)!important;
      opacity:0.75!important;
      clip-path:inset(60% 0 8% 0)!important;
      transform:translate(6px,-3px)!important;
    }
    .glitch-ritual.mega {
      animation: g-shake 0.4s steps(3)!important;
    }
    .glitch-ritual.mega::before {
      opacity:1!important;
      clip-path:inset(2% 0 75% 0)!important;
      transform:translate(-14px,6px)!important;
      animation: g-ms-a 0.3s steps(3)!important;
    }
    .glitch-ritual.mega::after {
      opacity:0.9!important;
      clip-path:inset(65% 0 5% 0)!important;
      transform:translate(12px,-5px)!important;
      animation: g-ms-b 0.3s steps(3)!important;
    }

    @keyframes g-int-a {
      0%   { transform:translate(-8px,3px); clip-path:inset(5% 0 70% 0); }
      50%  { transform:translate(10px,-5px); clip-path:inset(30% 0 40% 0); }
      100% { transform:translate(-4px,7px); clip-path:inset(55% 0 15% 0); }
    }
    @keyframes g-int-b {
      0%   { transform:translate(6px,-3px); clip-path:inset(60% 0 8% 0); }
      50%  { transform:translate(-9px,4px); clip-path:inset(15% 0 55% 0); }
      100% { transform:translate(5px,-6px); clip-path:inset(45% 0 25% 0); }
    }
    @keyframes g-shake {
      0%   { transform:translate(0,0); }
      25%  { transform:translate(-6px,3px); }
      50%  { transform:translate(8px,-4px); }
      75%  { transform:translate(-3px,-2px); }
      100% { transform:translate(0,0); }
    }
    @keyframes g-ms-a {
      0%   { transform:translate(-14px,6px); clip-path:inset(2% 0 75% 0); }
      33%  { transform:translate(16px,-8px); clip-path:inset(25% 0 50% 0); }
      66%  { transform:translate(-8px,10px); clip-path:inset(55% 0 20% 0); }
      100% { transform:translate(0,0); clip-path:inset(0 0 0 0); }
    }
    @keyframes g-ms-b {
      0%   { transform:translate(12px,-5px); clip-path:inset(65% 0 5% 0); }
      33%  { transform:translate(-15px,7px); clip-path:inset(10% 0 60% 0); }
      66%  { transform:translate(7px,-9px); clip-path:inset(40% 0 30% 0); }
      100% { transform:translate(0,0); clip-path:inset(0 0 0 0); }
    }

    /* Subtitle */
    .sub-text {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: #888888;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="glitch-card">
    <div class="glitch-scan-lines"></div>
    <div class="glitch-ritual-wrapper">
      <h1 class="glitch-ritual" data-text="Emilijus ♡ Rustina" id="glitch-ritual-text">
        Emilijus <span class="glitch-red">♡</span> Rustina
      </h1>
      <div class="sub-text">forever & always</div>
    </div>
  </div>

  <script>
    // Optional: add random intense/mega glitches for extra chaos (same as original)
    const textEl = document.getElementById('glitch-ritual-text');
    function startGlitchCycle() {
      function schedIntense() {
        textEl.classList.add('intense');
        setTimeout(() => textEl.classList.remove('intense'), 150 + Math.random()*300);
        setTimeout(schedIntense, 1200 + Math.random()*4000);
      }
      function schedMega() {
        textEl.classList.add('mega');
        setTimeout(() => textEl.classList.remove('mega'), 250 + Math.random()*400);
        if (Math.random()<0.3) {
          setTimeout(() => {
            textEl.classList.add('intense');
            setTimeout(() => textEl.classList.remove('intense'), 180);
          }, 250 + Math.random()*400 + 80);
        }
        setTimeout(schedMega, 4000 + Math.random()*12000);
      }
      setTimeout(schedIntense, 800);
      setTimeout(schedMega, 2500);
    }
    startGlitchCycle();
  </script>
</body>
</html>
